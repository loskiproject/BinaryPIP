<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 96" role="img" aria-labelledby="title">
  <title id="title">binarypip Next-Gen Terminal</title>
  <defs>
    <linearGradient id="exGrad3d" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FF87"/>
      <stop offset="50%" stop-color="#60EFFF"/>
      <stop offset="100%" stop-color="#00B8D9"/>
    </linearGradient>
    <linearGradient id="exDarkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- 3D Cube / Diamond Mark -->
  <rect x="6" y="8" width="80" height="80" rx="22" fill="url(#exDarkGrad)" stroke="url(#exGrad3d)" stroke-width="2.5"/>
  <path d="M46 22 L68 36 L46 50 L24 36 Z" fill="url(#exGrad3d)" filter="url(#glow)"/>
  <path d="M24 36 L46 50 L46 74 L24 60 Z" fill="#00B8D9" opacity="0.8"/>
  <path d="M68 36 L46 50 L46 74 L68 60 Z" fill="#00FF87" opacity="0.9"/>
  <!-- Text Logo -->
  <text x="104" y="62" fill="#F8FAFC" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="46" font-weight="800" letter-spacing="-1">binarypip</text>
  <text x="352" y="38" fill="#60EFFF" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="2">PRO</text>
  <circle cx="388" cy="56" r="4" fill="#00FF87" filter="url(#glow)"/>
</svg>
